iteration:
  tolerance: 1.0e-7
  max_steps: 8000000

gsis:
  enabled: true
  trace_relative_tolerance: 1.0e-10
  trace_absolute_tolerance: 1.0e-14
  trace_max_iterations: 1000
  trace_print_level: -1
  trace_preconditioner: direct
  boundary_heat_flux_from_vdf: true

velocity_mesh:
  polar_angles: 40
  azimuthal_angles: 80

dg:
  order: 3

flow:
  specific_heat: 1.0
  group_velocity: 1.0
  tau_r: 10
  tau_n: 0.01
  tau_threshold: 100

files:
  mesh: ../../reference/FortranCodes/A1_Nx11_Ny11.msh
  output_prefix: validation/results/knr10_knn1e-2/gsis/gsis
  output_samples: 109

boundary_conditions:
  - name: SWall
    physical_id: 11
    type: thermalizing
    temperature: 0.0
    x_offset: 0.0
    y_offset: 0.0
  - name: NWall
    physical_id: 12
    type: thermalizing
    temperature: 1.0
    x_offset: 0.0
    y_offset: 0.0
  - name: EWall
    physical_id: 13
    type: thermalizing
    temperature: 0.0
    x_offset: 0.0
    y_offset: 0.0
  - name: WWall
    physical_id: 14
    type: thermalizing
    temperature: 0.0
    x_offset: 0.0
    y_offset: 0.0
