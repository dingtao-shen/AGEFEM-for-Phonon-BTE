# ============================================================================
# AGE geometry sidecar — example / schema reference
# ============================================================================
# Binds Gmsh boundary physical-ids to the exact geometry of curved boundaries.
# Pair this file with a straight-sided mesh: reference it from the control YAML
# as  files.geometry: <this file>,  or name it  <mesh-stem>.age.yaml  next to
# the mesh for auto-discovery. If no sidecar is present the run is pure
# straight-sided and no AGE code executes.
#
# Parsed by the dedicated `age_geometry` loader (NOT the control-YAML parser).
# Grammar: a `curves:` list whose entries are introduced by `- ` and carry
# scalar fields only. Analytic curves carry parameters inline; nurbs and
# polyline curves carry bulk numeric data in a referenced `data_file`, because
# nested numeric arrays are deliberately out of grammar scope.
# ----------------------------------------------------------------------------

version: 1

curves:
  # --- circular_arc -------------------------------------------------------
  # Exact circle. Parameter lambda runs over [0, 1] (full circle).
  #   center       inline 2-vector [cx, cy]
  #   radius       circle radius (> 0)
  #   orientation  ccw | cw — sense of increasing lambda; fixes which side is
  #                the domain interior, and hence the outward-normal direction
  #                (for a hole, the material is outside the circle, so the
  #                domain-outward normal points toward the center).
  - boundary_id: 9
    type: circular_arc
    center: [-0.5, -0.5]
    radius: 0.25
    orientation: ccw

  # --- nurbs --------------------------------------------------------------
  # Exact NURBS curve, evaluated by the de Boor algorithm.
  #   degree     polynomial degree of the spline
  #   closed     true | false — whether the curve wraps
  #   data_file  path (relative to this sidecar) to the bulk definition.
  #              Whitespace/newline-delimited, `#` comments allowed:
  #                n
  #                x_0      y_0      w_0
  #                ...                       (n rows: control point x, y, weight)
  #                x_{n-1}  y_{n-1}  w_{n-1}
  #                m
  #                k_0 ... k_{m-1}            (m knot values, non-decreasing)
  - boundary_id: 10
    type: nurbs
    degree: 2
    closed: true
    data_file: hole10_nurbs.txt

  # --- polyline -----------------------------------------------------------
  # Boundary reconstructed from sampling nodes (rough / statistical surfaces).
  # Parameter lambda runs over [0, 1], piecewise-linear in cumulative chord
  # length; the sampling nodes are the segment breakpoints used by the AGE
  # area sub-triangulation.
  #   closed       true | false
  #   orientation  ccw | cw
  #   data_file    path (relative to this sidecar) to the node list.
  #                Whitespace/newline-delimited, `#` comments allowed:
  #                  n
  #                  x_0      y_0
  #                  ...                 (n rows: node x, y)
  #                  x_{n-1}  y_{n-1}
  - boundary_id: 20
    type: polyline
    closed: false
    orientation: ccw
    data_file: rough_top_nodes.txt
